name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Shorekeeper.sln

      - name: Build
        run: dotnet build Shorekeeper.sln -c Release --no-restore

      - name: Test
        run: dotnet test --solution Shorekeeper.sln -c Release --no-build
